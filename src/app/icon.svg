<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F5BFF"/>
      <stop offset="100%" style="stop-color:#7B61FF"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Scales of justice icon -->
  <g transform="translate(256,256)" fill="none" stroke="white" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center pillar -->
    <line x1="0" y1="-100" x2="0" y2="120"/>
    <!-- Base -->
    <line x1="-70" y1="120" x2="70" y2="120"/>
    <!-- Top bar -->
    <line x1="-110" y1="-100" x2="110" y2="-100"/>
    <!-- Left chain -->
    <line x1="-110" y1="-100" x2="-110" y2="-20"/>
    <!-- Right chain -->
    <line x1="110" y1="-100" x2="110" y2="-20"/>
    <!-- Left bowl -->
    <path d="M-160,-20 Q-110,60 -60,-20" fill="white" fill-opacity="0.3"/>
    <!-- Right bowl -->
    <path d="M60,-20 Q110,60 160,-20" fill="white" fill-opacity="0.3"/>
    <!-- Top circle -->
    <circle cx="0" cy="-100" r="16" fill="white"/>
  </g>
</svg>
